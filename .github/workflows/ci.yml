name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  version-bump:
    name: Check @version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ベースブランチとの差分を取るために全履歴を取得する
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-version-bump.mjs "origin/${{ github.base_ref }}"
